<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The document title, like every other visitor-facing string, is set from
      data/content.json at runtime. This value is the pre-render fallback shown
      while the data files load.
    -->
    <title>FlameSense - Wildfire Analytics</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!--
      Stylesheets are layered: tokens first (custom properties everything else
      resolves against), then element defaults, then the two views.
    -->
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/map.css" />
  </head>

  <body>
    <!--
      This file is a skeleton, not the page. Every element below is an empty
      mount point that src/ui/content.js fills from data/content.json; the
      content panels are inserted immediately before #map-demo. Nothing here
      should be given text content directly -- put copy in the data file.
    -->

    <nav></nav>

    <header class="hero" id="hero"></header>

    <!-- Content panels are injected here, between the hero and the map. -->

    <section id="map-demo">
      <div id="map"></div>
      <div class="fire-overlay" id="timeOverlay"></div>
      <div class="fire-overlay" id="growthOverlay"></div>
    </section>

    <footer></footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
